name: Notify Alien Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout alien-framework
        uses: actions/checkout@v7.0.1

      - name: Setup Java 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test framework
        run: mvn -B test-compile package -DskipTests

      - name: Trigger alien-apps deploy
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.APPS_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/PedroLucas63/alien-apps/dispatches \
            -d '{"event_type":"framework-updated"}'
